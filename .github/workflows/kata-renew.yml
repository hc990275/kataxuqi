name: "@s5gydl kata 自动续期任务"

on:
  schedule:
    # 每天执行：UTC 01:00 (北京时间 上午 09:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb curl wget gzip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sbase install chromedriver || true

    - name: Run Renew Script
      env:
        # 账号变量：仅使用 USERS_JSON (配置在 GitHub Repository Secrets 中)
        USERS_JSON: ${{ secrets.USERS_JSON }}
        # 代理变量（配置 PROXY_URL 或 SUB_URL 其中一个即可，脚本自动智能解析订阅/S5/TG等任意格式）
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SUB_URL: ${{ secrets.SUB_URL }}
        S5_URL: ${{ secrets.S5_URL }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      # 使用 xvfb-run 模拟有头环境运行 SeleniumBase UC 模式
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python kata_renew.py

    - name: Commit Renew Dates
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add renew_dates.json || true
        git diff --cached --quiet renew_dates.json || git commit -m "chore: update renew dates [skip ci]"
        for i in {1..5}; do
          git pull --rebase --autostash || true
          if git push; then
            break
          fi
          echo "⚠️ Push failed, retrying in 5 seconds ($i/5)..."
          sleep 5
        done

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ github.run_number }}
        path: screenshots/
        if-no-files-found: ignore
        retention-days: 7
